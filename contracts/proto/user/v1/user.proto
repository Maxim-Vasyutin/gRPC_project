syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/empty.proto";

option go_package = "contracts/generated/user/v1;userv1";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
}

//Register
message RegisterRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 64
  ];
}
message RegisterResponse {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}
//

//Login
message LoginRequest {
  //Поставил те же правила, чтобы не перегружать. 
  //Тут подойдёт просто проверка на "ненулёвость"
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [
    (buf.validate.field).string.min_len = 8,
    (buf.validate.field).string.max_len = 64
  ];
}

message LoginResponse {
  string access_token = 1 [(buf.validate.field).string.min_len = 8];
  string refresh_token = 2 [(buf.validate.field).string.min_len = 8];
  // Время жизни токенов в секундах, считая от момента выдачи.
  int64 access_expires_in = 3 [(buf.validate.field).int64.gt = 0];
  int64 refresh_expires_in = 4 [(buf.validate.field).int64.gt = 0];
}

//

//Refresh
message RefreshRequest {
  string refresh_token = 1 [
    (buf.validate.field).string.min_len = 16,
    (buf.validate.field).string.max_len = 128
  ];
}

message RefreshResponse {
  string access_token = 1 [(buf.validate.field).string.min_len = 8]; //new
  string refresh_token = 2 [(buf.validate.field).string.min_len = 8]; //new
  // Время жизни новых токенов в секундах, считая от момента выдачи.
  int64 access_expires_in = 3 [(buf.validate.field).int64.gt = 0];
  int64 refresh_expires_in = 4 [(buf.validate.field).int64.gt = 0];
}

//Logout
message LogoutRequest {
  // проверка на "не пустой" токен
  string refresh_token = 1 [
    (buf.validate.field).string.min_len = 16,
    (buf.validate.field).string.max_len = 128
  ];
}
